<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔍 جستجوی پروفایل‌های لینکدین</title>
    <style>
        /* ===== Reset & Base ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #f4f7fb;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        .container {
            max-width: 1100px;
            width: 100%;
            background: white;
            border-radius: 24px;
            padding: 30px 35px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08);
            transition: all 0.2s;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #0a66c2;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .subtitle {
            color: #666;
            font-size: 15px;
            margin-bottom: 28px;
            border-right: 4px solid #0a66c2;
            padding-right: 14px;
            background: #f8faff;
            border-radius: 0 10px 10px 0;
            padding: 10px 16px;
        }

        /* ===== Filters ===== */
        .filters {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 16px;
            background: #f9fcff;
            padding: 20px 22px;
            border-radius: 18px;
            border: 1px solid #e6edf4;
            margin-bottom: 30px;
        }

        .filter-group {
            flex: 1 1 180px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .filter-group label {
            font-size: 12px;
            font-weight: 600;
            color: #334e68;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .filter-group input,
        .filter-group select {
            padding: 10px 14px;
            border: 1px solid #d0dbe8;
            border-radius: 12px;
            font-size: 14px;
            background: white;
            transition: 0.2s;
            outline: none;
            width: 100%;
        }

        .filter-group input:focus,
        .filter-group select:focus {
            border-color: #0a66c2;
            box-shadow: 0 0 0 3px rgba(10, 102, 194, 0.15);
        }

        .btn-search {
            background: #0a66c2;
            color: white;
            border: none;
            padding: 10px 30px;
            border-radius: 40px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            align-self: flex-end;
            height: 44px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-search:hover {
            background: #084e96;
            transform: scale(1.02);
        }

        .btn-search:active {
            transform: scale(0.97);
        }

        /* ===== Results Info ===== */
        .results-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .results-count {
            font-size: 14px;
            color: #4a5b6e;
            background: #edf3fa;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 500;
        }

        .results-count strong {
            color: #0a66c2;
        }

        /* ===== Results Grid ===== */
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .profile-card {
            background: white;
            border: 1px solid #eaf0f6;
            border-radius: 20px;
            padding: 20px 18px;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .profile-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.07);
            border-color: #cbddee;
        }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            color: #0a2647;
            margin-bottom: 4px;
        }

        .profile-title {
            font-size: 14px;
            color: #0a66c2;
            font-weight: 500;
            margin-bottom: 10px;
        }

        .profile-skills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 10px 0 12px;
        }

        .skill-tag {
            background: #eaf3ff;
            color: #0a66c2;
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 40px;
            font-weight: 500;
            letter-spacing: 0.2px;
        }

        .profile-location {
            font-size: 13px;
            color: #5b6f82;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 10px;
        }

        .profile-link {
            font-size: 13px;
            color: #0a66c2;
            text-decoration: none;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: 0.2s;
        }

        .profile-link:hover {
            color: #084e96;
            text-decoration: underline;
        }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #8a9aa8;
            font-size: 18px;
        }

        .no-results span {
            font-size: 48px;
            display: block;
            margin-bottom: 12px;
        }

        /* ===== Pagination ===== */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
            flex-wrap: wrap;
        }

        .pagination button {
            background: white;
            border: 1px solid #d0dbe8;
            color: #1e2a3a;
            padding: 8px 20px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .pagination button:hover:not(:disabled) {
            background: #0a66c2;
            color: white;
            border-color: #0a66c2;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .pagination .page-info {
            font-size: 14px;
            color: #3a4a5c;
            background: #f0f5fc;
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 500;
        }

        /* ===== Responsive ===== */
        @media (max-width: 700px) {
            .container {
                padding: 20px 16px;
            }
            .filters {
                flex-direction: column;
                padding: 16px;
            }
            .filter-group {
                flex: 1 1 auto;
            }
            .btn-search {
                width: 100%;
                justify-content: center;
            }
            .results-grid {
                grid-template-columns: 1fr;
            }
            .results-info {
                flex-direction: column;
                align-items: flex-start;
            }
        }

        /* ===== Loading ===== */
        .loading {
            text-align: center;
            padding: 40px;
            color: #5b6f82;
            font-size: 16px;
        }
        .loading::after {
            content: " ...";
            animation: dots 1.2s steps(3, end) infinite;
        }
        @keyframes dots {
            0% { content: " ."; }
            33% { content: " .."; }
            66% { content: " ..."; }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🔍 جستجوی پروفایل‌ها</h1>
    <div class="subtitle">
        ⚡ بیش از ۳۰۰ پروفایل لینکدین – با Elasticsearch و صفحه‌بندی
    </div>

    <!-- ===== فیلترها ===== -->
    <div class="filters">
        <div class="filter-group">
            <label for="keyword">🔎 کلمه کلیدی</label>
            <input type="text" id="keyword" placeholder="مثال: manager, python, ...">
        </div>

        <div class="filter-group">
            <label for="skill">🧩 مهارت</label>
            <input type="text" id="skill" placeholder="مثال: recruiting, django">
        </div>

        <div class="filter-group">
            <label for="title">💼 عنوان شغلی</label>
            <input type="text" id="title" placeholder="مثال: engineer, director">
        </div>

        <div class="filter-group">
            <label for="country">🌍 کشور</label>
            <input type="text" id="country" placeholder="مثال: united states">
        </div>

        <div class="filter-group">
            <label for="industry">🏭 صنعت</label>
            <input type="text" id="industry" placeholder="مثال: civil engineering">
        </div>

        <button class="btn-search" id="searchBtn">🔍 جستجو</button>
    </div>

    <!-- ===== اطلاعات نتایج ===== -->
    <div class="results-info">
        <div class="results-count" id="resultsCount">۰ نتیجه</div>
        <div style="font-size:13px; color:#7a8a9a;" id="pageInfo"></div>
    </div>

    <!-- ===== نتایج ===== -->
    <div class="results-grid" id="resultsContainer">
        <div class="loading">در حال بارگذاری</div>
    </div>

    <!-- ===== صفحه‌بندی ===== -->
    <div class="pagination" id="paginationControls">
        <button id="prevPage" disabled>◀ قبلی</button>
        <span class="page-info" id="currentPageDisplay">صفحه ۱</span>
        <button id="nextPage">بعدی ▶</button>
    </div>
</div>

<script>
    (function() {
        // ---- عناصر DOM ----
        const keywordInput = document.getElementById('keyword');
        const skillInput = document.getElementById('skill');
        const titleInput = document.getElementById('title');
        const countryInput = document.getElementById('country');
        const industryInput = document.getElementById('industry');
        const searchBtn = document.getElementById('searchBtn');
        const resultsContainer = document.getElementById('resultsContainer');
        const resultsCount = document.getElementById('resultsCount');
        const pageInfo = document.getElementById('pageInfo');
        const prevBtn = document.getElementById('prevPage');
        const nextBtn = document.getElementById('nextPage');
        const currentPageDisplay = document.getElementById('currentPageDisplay');

        // ---- وضعیت ----
        let currentPage = 1;
        let totalPages = 1;
        let totalCount = 0;
        let currentUrl = '';

        // ---- تابع جستجو ----
        async function performSearch(page = 1) {
            const keyword = keywordInput.value.trim();
            const skill = skillInput.value.trim();
            const title = titleInput.value.trim();
            const country = countryInput.value.trim();
            const industry = industryInput.value.trim();

            const params = new URLSearchParams({
                q: keyword,
                skill: skill,
                title: title,
                country: country,
                industry: industry,
                page: page,
            });

            const url = `/api/search/?${params.toString()}`;
            currentUrl = url;

            // نمایش لودینگ
            resultsContainer.innerHTML = `<div class="loading">در حال جستجو</div>`;
            resultsCount.textContent = 'در حال بارگذاری...';

            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('خطا در ارتباط با سرور');

                const data = await response.json();

                // ذخیره اطلاعات صفحه‌بندی
                totalCount = data.count || 0;
                const pageSize = 10;
                totalPages = Math.ceil(totalCount / pageSize) || 1;
                currentPage = page;

                // نمایش تعداد نتایج
                resultsCount.innerHTML = `<strong>${totalCount}</strong> نتیجه`;

                // نمایش نتایج
                renderResults(data.results || []);

                // بروزرسانی صفحه‌بندی
                updatePagination(data);

            } catch (error) {
                console.error(error);
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <span>⚠️</span>
                        خطا در ارتباط با سرور. لطفاً دوباره تلاش کنید.
                    </div>
                `;
                resultsCount.textContent = 'خطا';
            }
        }

        // ---- رندر نتایج ----
        function renderResults(items) {
            if (!items || items.length === 0) {
                resultsContainer.innerHTML = `
                    <div class="no-results">
                        <span>🔍</span>
                        هیچ نتیجه‌ای یافت نشد.
                        <br><small style="font-size:14px;">سعی کنید فیلترها را تغییر دهید.</small>
                    </div>
                `;
                return;
            }

            let html = '';
            items.forEach(item => {
                const skills = Array.isArray(item.skills) ? item.skills : [];
                const skillsHtml = skills.slice(0, 6).map(s =>
                    `<span class="skill-tag">${escapeHtml(s)}</span>`
                ).join('');

                html += `
                    <div class="profile-card">
                        <div class="profile-name">${escapeHtml(item.full_name || 'نامشخص')}</div>
                        <div class="profile-title">${escapeHtml(item.job_title || '—')}</div>
                        <div class="profile-skills">${skillsHtml || '<span style="color:#aaa;font-size:12px;">مهارتی ثبت نشده</span>'}</div>
                        <div class="profile-location">📍 ${escapeHtml(item.location_name || 'نامشخص')}</div>
                        ${item.linkedin_url ? `<a href="${escapeHtml(item.linkedin_url)}" target="_blank" class="profile-link">🔗 مشاهده پروفایل</a>` : ''}
                    </div>
                `;
            });

            resultsContainer.innerHTML = html;
        }

        // ---- بروزرسانی صفحه‌بندی ----
        function updatePagination(data) {
            const hasNext = !!data.next;
            const hasPrev = !!data.previous;

            prevBtn.disabled = !hasPrev;
            nextBtn.disabled = !hasNext;

            currentPageDisplay.textContent = `صفحه ${currentPage} از ${totalPages}`;
            pageInfo.textContent = `نمایش ${(currentPage - 1) * 10 + 1} تا ${Math.min(currentPage * 10, totalCount)} از ${totalCount}`;

            // اتصال رویدادهای دکمه‌ها
            prevBtn.onclick = () => {
                if (hasPrev) {
                    const prevPage = currentPage - 1;
                    performSearch(prevPage);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };

            nextBtn.onclick = () => {
                if (hasNext) {
                    const nextPage = currentPage + 1;
                    performSearch(nextPage);
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            };
        }

        // ---- ابزار escape برای امنیت ----
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // ---- رویداد جستجو ----
        searchBtn.addEventListener('click', () => performSearch(1));

        // ---- جستجو با Enter ----
        document.querySelectorAll('.filter-group input').forEach(input => {
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') performSearch(1);
            });
        });

        // ---- جستجوی اولیه (بارگذاری صفحه) ----
        window.addEventListener('load', () => performSearch(1));
    })();
</script>

</body>
